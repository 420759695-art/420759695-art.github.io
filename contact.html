<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 | 搞人之家</title>
  <meta name="description" content="联系搞人之家，获取付费项目咨询。我们将在48星期内回复。">
  <link rel="canonical" href="https://www.example.com/contact.html">
  <style>
    :root{--primary:#0077B6;--primary-dark:#023E8A;--secondary:#00B4D8;--accent:#48CAE4;--accent-light:#90E0EF;--dark:#03045E;--light:#F0F8FF;--white:#fff;--text:#1a1a2e;--text-light:#555;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--text);line-height:1.7;background:var(--light);}
    .container{max-width:1100px;margin:0 auto;padding:0 24px;}
    .navbar{position:fixed;top:0;width:100%;z-index:1000;padding:16px 0;background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);box-shadow:0 2px 20px rgba(0,0,0,0.05);}
    .navbar .container{display:flex;justify-content:space-between;align-items:center;}
    .logo{font-size:1.7rem;font-weight:800;color:var(--primary-dark);text-decoration:none;}
    .logo span{color:var(--accent);}
    .nav-links{display:flex;gap:2rem;list-style:none;align-items:center;}
    .nav-links a{color:var(--text);text-decoration:none;font-weight:500;font-size:0.95rem;}
    .nav-links a:hover{color:var(--accent);}
    .nav-cta{background:var(--accent);color:white!important;padding:8px 20px!important;border-radius:30px;}
    .menu-toggle{display:none;cursor:pointer;font-size:1.6rem;background:none;border:none;color:var(--primary-dark);}
    @media(max-width:768px){.nav-links{position:fixed;top:0;right:-100%;width:72%;height:100vh;background:white;flex-direction:column;padding:90px 40px;transition:right 0.4s;gap:1.5rem;}.nav-links.active{right:0;}.menu-toggle{display:block;}}
    .page-header{padding:140px 0 60px;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:white;text-align:center;}
    .page-header h1{font-size:2.8rem;font-weight:800;}
    .breadcrumb{color:rgba(255,255,255,0.7);margin-top:0.5rem;}
    .breadcrumb a{color:var(--accent-light);text-decoration:none;}
    section{padding:80px 0;}
    .contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:60px;align-items:start;}
    .contact-info h2{font-size:2rem;color:var(--dark);margin-bottom:1rem;}
    .contact-info p{color:var(--text-light);margin-bottom:1.5rem;}
    .info-item{display:flex;align-items:center;gap:12px;margin-bottom:1rem;color:var(--text-light);}
    .info-item .icon{font-size:1.5rem;}
    .contact-form{background:white;padding:2.5rem;border-radius:16px;box-shadow:0 8px 32px rgba(0,119,182,0.1);}
    .contact-form h3{font-size:1.4rem;color:var(--dark);margin-bottom:1.5rem;}
    .form-group{margin-bottom:1.2rem;}
    .form-group label{display:block;margin-bottom:0.4rem;font-weight:600;font-size:0.9rem;color:var(--text);}
    .form-group input,.form-group textarea,.form-group select{
      width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:8px;
      font-family:inherit;font-size:1rem;transition:border-color 0.3s;background:#fafafa;
    }
    .form-group input:focus,.form-group textarea:focus,.form-group select:focus{
      border-color:var(--secondary);outline:none;background:white;
    }
    .submit-btn{
      width:100%;padding:14px;background:var(--primary);color:white;border:none;
      border-radius:8px;font-weight:700;font-size:1.05rem;cursor:pointer;
      transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .submit-btn:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,119,182,0.3);}
    .submit-btn:disabled{background:#aaa;cursor:not-allowed;transform:none;}
    .loader{width:20px;height:20px;border:3px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;display:none;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .success-msg{display:none;text-align:center;padding:2rem;color:#00b894;font-weight:600;}
    @media(max-width:768px){.contact-grid{grid-template-columns:1fr;}}
    footer{background:var(--dark);color:rgba(255,255,255,0.7);padding:40px 0;text-align:center;}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">搞人<span>之家</span></a>
      <button class="menu-toggle" id="menuToggle">&#9776;</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">首页</a></li><li><a href="about.html">关于</a></li><li><a href="services.html">服务</a></li>
        <li><a href="portfolio.html">案例</a></li><li><a href="blog.html">博客</a></li>
        <li><a href="contact.html" class="nav-cta">联系我们</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1>联系我们</h1>
      <p class="breadcrumb"><a href="index.html">首页</a> &raquo; 联系</p>
    </div>
  </div>

  <section>
    <div class="container">
      <div class="contact-grid">
        <div class="contact-info">
          <h2>开启对话</h2>
          <p>如果你是有一个明确的项目需求，或是只想聊聊想法——我建议你去买ds api部署在本地，那个很好用。</p>
          <div class="info-item"><span class="icon">📧</span> 420759695-art.github.io</div>
          <div class="info-item"><span class="icon">📞</span> +86-132919152115</div>
          <div class="info-item"><span class="icon">📍</span> 宁波市奉化区溪口镇武岭路77号</div>
          <div class="info-item"><span class="icon">⏰</span> 周八至周十六 13:00-13:01</div>
        </div>

       <div class="contact-form" id="formContainer">
  <h3>发送咨询</h3>
  <!-- ====== 使用 Static Forms 发送邮件 ====== -->
  <form id="contactForm"
        action="https://api.staticforms.xyz/submit"
        method="POST">

    <!-- ① 你的 Static Forms Access Key（去后台复制） -->
    <input type="hidden" name="accessKey" value="sf_adc3124c98132160702a873c">

    <!-- ② 邮件标题（收到的邮件会显示这个） -->
    <input type="hidden" name="subject" value="网站新咨询">

    <!-- ③ 回复地址：填你表单里邮箱字段的 name（这里是 email） -->
    <input type="hidden" name="replyTo" value="email">

    <!-- ④ 防垃圾 honeypot（机器人会填，人类看不见） -->
    <input type="text" name="_honeypot" style="display:none" autocomplete="off">

    <!-- ⑤ 提交成功后跳转的页面（可选，没有就删掉） -->
    <input type="hidden" name="redirectTo" value="https://你的域名/thanks.html">

    <div class="form-group">
      <label for="name">姓名 *</label>
      <input type="text" id="name" name="name" placeholder="你的姓名" required>
    </div>

    <div class="form-group">
      <label for="email">邮箱 *</label>
      <input type="email" id="email" name="email" placeholder="your@company.com" required>
    </div>

    <div class="form-group">
      <label for="service">感兴趣的服务</label>
      <select id="service" name="service">
        <option value="">请选择</option>
                <option value="星穹铁道">星穹铁道</option>
                <option value="原神启动">原神启动</option>
                <option value="明日方舟">明日方舟</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label for="message">项目描述 *</label>
              <textarea id="message" name="message" rows="4" placeholder="请描述你的项目需求、目标和预算范围..." required></textarea>
            </div>
            <!-- Formspree 自动处理垃圾过滤，无需额外 honeypot -->
            <button type="submit" class="submit-btn" id="submitBtn">
              <span class="btn-text">发送咨询</span>
              <span class="loader" id="loader"></span>
            </button>
          </form>
          <div class="success-msg" id="successMsg">
            ✅ 咨询已成功发送！我们将在24小时内回复你。
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer><div class="container"><p>&copy; 2026 搞人之家. 保留所有权利。</p></div></footer>

  <script>
    // 移动端菜单
    document.getElementById('menuToggle').addEventListener('click',()=>{
      document.getElementById('navLinks').classList.toggle('active');
    });

    // ====== 真实邮件发送：AJAX 提交 + 加载状态 ======
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = submitBtn.querySelector('.btn-text');
    const loader = document.getElementById('loader');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      // 显示加载状态
      submitBtn.disabled = true;
      btnText.textContent = '发送中…';
      loader.style.display = 'inline-block';

      try {
        const formData = new FormData(form);
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          // 成功
          form.style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          alert('发送失败，请稍后重试或直接发送邮件至 hello@deepblue.tech');
        }
      } catch (error) {
        alert('网络错误，请检查连接后重试。');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = '发送咨询';
        loader.style.display = 'none';
      }
    });
  </script>
</body>
</html>
